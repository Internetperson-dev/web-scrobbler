name: Build extensions

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build:
    name: Build the extension for ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Newer npm releases block dependency install scripts by default.
          # The build needs the native canvas, pngquant and jpegtran
          # binaries, which are downloaded by those scripts.
          npm_config_dangerously_allow_all_scripts: 'true'

      - name: Build the extension
        run: npm run dist ${{ matrix.browser }}

      - name: Upload the extension as an artifact
        uses: actions/upload-artifact@v7
        with:
          # Upload the unpacked build so that the artifact itself is a
          # valid extension package: the file you get from GitHub is a
          # zip with manifest.json at the root and can be loaded in
          # Firefox (about:debugging) or unpacked in Chrome directly.
          name: web-scrobbler-${{ matrix.browser }}
          path: build/${{ matrix.browser }}
          if-no-files-found: error
